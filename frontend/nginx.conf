server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 500 502 503 504 /50x.html;

    # Docker's embedded DNS. Using a variable in proxy_pass (below) defers
    # upstream resolution to request time, so nginx starts even if api is down
    # and picks up api's new IP after a backend redeploy (re-resolves every 10s).
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Backend health is OUTSIDE /api — UptimeRobot monitors /health.
    location = /health {
        set $upstream api:8000;
        proxy_pass http://$upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE endpoint — must not be buffered, or tokens never reach the browser.
    # Exact match takes priority over the /api/ prefix block below.
    location = /api/explain {
        set $upstream api:8000;
        proxy_pass http://$upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
    }

    # $request_uri keeps the full original path+query (/api/search stays intact).
    location /api/ {
        set $upstream api:8000;
        proxy_pass http://$upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite hashed assets are content-addressed — cache forever.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, else clients keep stale asset hashes.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Static 5xx page — served by error_page when the api upstream is down or
    # nginx itself errors. `internal` = not reachable directly from outside.
    location = /50x.html {
        include /etc/nginx/conf.d/security-headers.conf;
        internal;
        add_header Cache-Control "no-store";
    }

    # SPA fallback for client-side routing (TanStack Router).
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
